<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ミライすごろく</title>
<script src="vendor/mqtt.min.js"></script>
<style>
:root{
  --bg:#fff8ef; --panel:#ffffff; --ink:#2b2420; --sub:#7a6d63; --line:#e8dccd;
  --accent:#ff7a45; --accent-ink:#fff; --good:#1f9d61; --bad:#d6453d; --tile:#fffdf9;
  --shadow:0 2px 10px rgba(80,50,20,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1a17; --panel:#27231f; --ink:#f3ece4; --sub:#b3a698; --line:#3d362f;
    --accent:#ff8a5c; --accent-ink:#1d1a17; --good:#4cc98a; --bad:#ff7a70; --tile:#2f2a25;
    --shadow:0 2px 10px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#1d1a17; --panel:#27231f; --ink:#f3ece4; --sub:#b3a698; --line:#3d362f;
  --accent:#ff8a5c; --accent-ink:#1d1a17; --good:#4cc98a; --bad:#ff7a70; --tile:#2f2a25;
  --shadow:0 2px 10px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;line-height:1.5}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:var(--accent-ink);font-weight:700}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
button:disabled{opacity:.45;cursor:default}
input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--tile);color:var(--ink);width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
header h1{font-size:22px;margin:0}
header .code{margin-left:auto;font-size:13px;color:var(--sub)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.home{max-width:460px;margin:40px auto;display:grid;gap:14px}
.home h2{margin:0 0 4px;font-size:18px}
.muted{color:var(--sub);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.invite{display:flex;gap:8px}
.invite input{font-size:13px}
.plist{display:grid;gap:8px;margin:10px 0}
.pl{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.8);box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.tag{font-size:11px;padding:1px 6px;border-radius:6px;border:1px solid var(--line);color:var(--sub)}
.game{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
@media (max-width:900px){.game{grid-template-columns:1fr}}
.board{padding:0;overflow:hidden}
.stage{position:relative;height:min(68vh,620px);border-radius:16px;overflow:hidden;background:#bfe6ff}
.stage .c3d{position:absolute;inset:0;width:100%;height:100%;display:block}
.minimap{position:absolute;right:10px;top:10px;width:22%;max-width:190px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:12px;padding:4px;cursor:pointer;box-shadow:var(--shadow)}
.minimap svg{width:100%;height:auto;display:block}
.minimap .tilelabel{display:none}
.minimap .mmttl{font-size:11px;color:var(--sub);text-align:center}
.camctl{position:absolute;left:10px;bottom:10px;display:flex;gap:6px}
.camctl button{padding:6px 12px;font-size:13px;background:color-mix(in srgb,var(--panel) 90%,transparent);color:var(--ink);border:1px solid var(--line);font-weight:600}
.camctl button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stage.flat{height:auto;background:none}
.stage.flat .minimap{position:static;width:100%;max-width:none;border:0;box-shadow:none;cursor:default;background:none;padding:8px}
.stage.flat .minimap .tilelabel{display:inline}
.stage.flat .camctl,.stage.flat .mmttl{display:none}
@media (max-width:600px){.stage{height:44vh}.minimap{width:30%}.wheel-box{width:120px;height:120px}}
.side{display:grid;gap:12px;align-content:start}
.players{display:grid;gap:8px}
.pc{padding:10px 12px;border:1px solid var(--line);border-radius:12px;display:grid;gap:2px;font-size:13px}
.pc.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.pc .top{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.pc .money{margin-left:auto}
.neg{color:var(--bad)}
.ctrl{display:grid;gap:10px;justify-items:center;text-align:center}
.ctrl .who{font-weight:700}
.choices{display:grid;gap:8px;width:100%}
.choices button{width:100%}
.wheel-box{position:relative;width:170px;height:170px}
.wheel-box svg{width:100%;height:100%}
#wheel{transition:transform 1.4s cubic-bezier(.15,.75,.2,1);transform-origin:50% 50%}
.pointer{position:absolute;left:50%;top:-4px;transform:translateX(-50%);width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:18px solid var(--ink)}
.handbox{width:100%;display:grid;gap:6px;margin-top:8px;text-align:left}
.hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.cardbtn{display:grid;gap:2px;text-align:left;background:linear-gradient(160deg,#fff7e6,#ffe8cc);color:#3b2f25;border:1px solid #f5c58b;padding:8px;font-weight:500;transition:transform .15s}
.cardbtn:not(:disabled):hover{transform:translateY(-3px) rotate(-1deg)}
.cardbtn .ci{font-size:22px}.cardbtn b{font-size:14px}.cardbtn small{font-size:11px;color:#7a5b3a;line-height:1.35}
.cardbtn:disabled{opacity:.7}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.log{max-height:220px;overflow:auto;font-size:13px;display:grid;gap:4px}
.log div{border-bottom:1px dashed var(--line);padding-bottom:3px}
/* できごとの2D演出 */
.event{position:fixed;left:50%;top:46%;z-index:30;width:min(88vw,360px);pointer-events:none;background:var(--panel);color:var(--ink);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;text-align:center;opacity:0;transform:translate(-50%,-50%) scale(.3)}
.event.show{animation:evpop .55s cubic-bezier(.2,1.5,.4,1) forwards}
.event.show.loss{animation:evpop .55s cubic-bezier(.2,1.5,.4,1) forwards,evshake .45s .55s}
.event.hide{opacity:1;transform:translate(-50%,-50%);animation:evout .25s forwards}
@keyframes evpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-10deg)}100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}}
@keyframes evout{to{opacity:0;transform:translate(-50%,-62%) scale(.92)}}
@keyframes evshake{0%,100%{transform:translate(-50%,-50%)}20%{transform:translate(-53%,-50%) rotate(-2deg)}40%{transform:translate(-47%,-50%) rotate(2deg)}60%{transform:translate(-52%,-50%)}80%{transform:translate(-48%,-50%)}}
.ev-band{padding:16px 16px 10px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;position:relative;overflow:hidden}
.ev-band::after{content:"";position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent 0 20deg,rgba(255,255,255,.18) 20deg 40deg,transparent 40deg 60deg,rgba(255,255,255,.18) 60deg 80deg,transparent 80deg 100deg,rgba(255,255,255,.18) 100deg 120deg,transparent 120deg);animation:spinrays 6s linear infinite}
@keyframes spinrays{to{transform:rotate(360deg)}}
.ev-icon{font-size:58px;display:inline-block;position:relative;z-index:1;animation:evbounce .9s ease-in-out infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
@keyframes evbounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px) rotate(6deg)}}
.ev-ttl{font-weight:800;font-size:20px;position:relative;z-index:1;text-shadow:0 2px 6px rgba(0,0,0,.3)}
.ev-body{padding:12px 16px 16px;display:grid;gap:8px}
.ev-who{font-size:13px;color:var(--sub)}
.ev-amt{font-size:30px;font-weight:900;letter-spacing:.02em}
.ev-amt.plus{color:var(--good)}.ev-amt.minus{color:var(--bad)}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.chip{padding:3px 10px;border-radius:99px;background:#e7f5ff;color:#1864ab;font-weight:800;font-size:14px;animation:chipin .45s backwards}
.chip.down{background:#fff0f6;color:#c2255c}
@keyframes chipin{from{opacity:0;transform:translateY(10px) scale(.6)}}
.fx2d{position:fixed;inset:0;pointer-events:none;z-index:29;overflow:hidden}
.pt{position:absolute;left:0;top:0;font-size:26px;will-change:transform,opacity}
.pt.fall{animation:ptfall var(--d) cubic-bezier(.4,.1,.8,.6) forwards}
.pt.rise{animation:ptrise var(--d) ease-out forwards}
.pt.burst{animation:ptburst var(--d) cubic-bezier(.1,.7,.3,1) forwards}
.pt.conf{width:9px;height:14px;border-radius:2px}
@keyframes ptfall{from{transform:translate(var(--x),-8vh) rotate(0)}to{transform:translate(calc(var(--x) + var(--dx)),105vh) rotate(var(--r))}}
@keyframes ptrise{from{transform:translate(var(--x),85vh) scale(.6);opacity:1}to{transform:translate(calc(var(--x) + var(--dx)),15vh) scale(1.2);opacity:0}}
@keyframes ptburst{from{transform:translate(50vw,46vh) rotate(0);opacity:1}80%{opacity:1}to{transform:translate(calc(50vw + var(--tx)),calc(46vh + var(--ty))) rotate(var(--r));opacity:0}}
/* 選択肢カード */
.choice-modal{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(30,20,10,.35);backdrop-filter:blur(2px)}
.choice-modal.show{display:flex}
.cm{width:min(100%,460px);max-height:88vh;overflow:auto;display:grid;gap:10px;text-align:center;animation:evpop2 .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes evpop2{from{opacity:0;transform:scale(.7) translateY(20px)}}
.cm-icon{font-size:46px;animation:evbounce 1.2s ease-in-out infinite}
.cm-title{font-weight:800;font-size:19px}
.cm-opts{display:grid;gap:8px}
.cm-opt{display:grid;gap:2px;text-align:left;background:linear-gradient(160deg,#fff4e6,#ffe8cc);color:#3b2f25;border:1px solid #f5c58b;font-weight:500;animation:chipin .35s backwards;transition:transform .15s}
.cm-opt:not(:disabled):hover{transform:translateY(-2px)}
.cm-opt b{font-size:15px}.cm-opt small{font-size:12px;color:#7a5b3a}
.cm-opt:disabled{background:#f1f3f5;border-color:#dee2e6;color:#868e96}
.cm-opt:disabled small{color:#adb5bd}
.cm-hide{justify-self:center;padding:6px 14px;font-size:13px}
.gsel{display:flex;gap:8px;align-items:center}
.gsel button{flex:1}
.gsel button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--sub)}
.stats b{color:var(--ink)}
.result{display:grid;gap:8px}
.result .r{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px}
.result .rank{font-size:22px;font-weight:800;width:36px;text-align:center}
.banner{padding:8px 12px;border-radius:10px;background:var(--bad);color:#fff;font-size:13px;margin-bottom:10px}
.tilelabel{font-size:9px;fill:var(--sub)}
.tileicon{font-size:20px}
.rules{font-size:13px;color:var(--sub)}
.rules summary{cursor:pointer;color:var(--ink)}
@media (max-width:480px){.wrap{padding:12px 16px}.tilelabel{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>🎲 ミライすごろく</h1><span class="code" id="hdrCode"></span></header>
  <div id="banner"></div>
  <div id="app"></div>
</div>
<div class="event" id="event"></div>
<div class="choice-modal" id="choiceModal"></div>
<div class="fx2d" id="fx2d"></div>
<script>
"use strict";

  {name:"ショップ店員",salary:50,req:{charm:3}},{name:"大工",salary:70,req:{body:5}},{name:"ダーツバー店員",salary:55,req:{sense:2,charm:2}},

// 夢追いコースの仕事：給料は低めだけど「夢チャンス」で大きく稼げる

const FREETER={name:"フリーター",salary:35,req:{}};
const HOUSES=[{name:"こぢんまりハウス",cost:200},{name:"ひろびろマンション",cost:400},{name:"ゆめのお城",cost:800}];

const PARTNERS=[

  {name:"ナツキ",g:"f",icon:"🏐",like:"body",desc:"バレーボール選手。いっしょに体を動かせる人が好き"},
  {name:"リコ",g:"f",icon:"⛺",like:"body",desc:"キャンプ好きの保育士。アウトドア派が好き"},

  {name:"カイト",g:"m",icon:"🔭",like:"int",desc:"天文台の研究員。知的な会話が好き"},
  {name:"ハヤト",g:"m",icon:"🎯",like:"sense",desc:"ダーツプロをめざす青年。ダーツがうまい人に弱い"},
  {name:"レン",g:"m",icon:"🎙️",like:"charm",desc:"ラジオDJ。話していて楽しい人が好き"},
  {name:"ユウキ",g:"m",icon:"⛺",like:"body",desc:"キャンプ好きの保育士。アウトドア派が好き"},
  {name:"シュン",g:"m",icon:"🪑",like:"sense",desc:"家具デザイナー。センスのある人にひかれる"}];
const candidates=p=>PARTNERS.map((q,i)=>[q,i]).filter(([q])=>q.g!==(p.gender||"m"));
const DATES=[
  {label:"映画を見る",icon:"🎬",cost:10,aff:12},
  {label:"遊園地へ行く",icon:"🎡",cost:30,aff:22},
  {label:"手料理でおもてなし",icon:"🍳",cost:0,aff:8,bonus:{stat:"sense",min:5,aff:14}},
  {label:"ダーツバーで勝負",icon:"🎯",cost:15,aff:9,bonus:{stat:"sense",min:6,aff:20}},
  {label:"高級レストラン",icon:"🍷",cost:60,aff:30}];
// 選択肢つきイベント。eff は能力値とお金（万円）の増減。

  park:{title:"公園でなにして遊ぶ？",icon:"🛝",opts:[{label:"鬼ごっこ",eff:{body:2}},{label:"砂場でお城づくり",eff:{sense:2}},{label:"虫の観察",eff:{int:2}},{label:"みんなと仲良く",eff:{charm:2}}]},

  camp:{title:"林間学校",icon:"🏕️",opts:[{label:"山登り",eff:{body:2}},{label:"星座の観察",eff:{int:2}},{label:"キャンプファイヤーの出し物",eff:{charm:2}},{label:"スケッチ",eff:{sense:2}}]},
  summer:{title:"夏休み",icon:"🌻",opts:[{label:"毎日プール",eff:{body:2}},{label:"図書館に通う",eff:{int:2}},{label:"絵日記をていねいに",eff:{sense:2}},{label:"いとこと遊ぶ",eff:{charm:2}}]},

  },
  host(code,onMsg,onReady,onFail){
    this.mode="host";this.code=code;
    if(LOCAL){
      this.bc=new BroadcastChannel("mirai-"+code);
      this.bc.onmessage=e=>{const d=e.data;if(d.to==="host")onMsg(d.from,d.msg);};
      setTimeout(onReady,0);return;
    }
    const start=params.get("b")!=null?+params.get("b"):0;
    const tryAt=k=>{
      if(k>=BROKERS.length){onFail("通信サーバーに接続できませんでした。ネット接続を確認して、ページを再読み込みしてください。");return;}
      const i=(start+k)%BROKERS.length;
      this.connect(i,{will:{topic:TOPIC(code)+"/c",payload:JSON.stringify({to:"*",msg:{t:"hostgone"}}),qos:0,retain:false}},c=>{
        c.on("message",(t,buf)=>{let d;try{d=JSON.parse(buf.toString())}catch(e){return}if(d&&d.from&&d.msg)onMsg(d.from,d.msg);});
        c.subscribe(TOPIC(code)+"/h",{qos:1},err=>{if(err)onFail("通信サーバーでエラーが起きました。");else onReady();});
      },()=>tryAt(k+1));
    };
    tryAt(0);
  },
  pub(msg){const t=TOPIC(this.code)+"/c";this.client&&this.client.publish(t,JSON.stringify(msg),{qos:1});},
  broadcast(msg){
    if(LOCAL){this.bc&&this.bc.postMessage({to:"*",msg});return;}
    this.pub({to:"*",msg});
  },
  sendTo(id,msg){
    if(LOCAL){this.bc&&this.bc.postMessage({to:id,msg});return;}
    this.pub({to:id,msg});
  },
  join(code,onMsg,onOpen,onFail){
    this.mode="client";this.code=code;
    if(LOCAL){
      this.bc=new BroadcastChannel("mirai-"+code);
      this.bc.onmessage=e=>{const d=e.data;if(d.to==="*"||d.to===myId)onMsg(d.msg);};
      setTimeout(onOpen,0);return;
    }
    const i=Math.min(+(params.get("b")||0),BROKERS.length-1);
    this.connect(i,{will:{topic:TOPIC(code)+"/h",payload:JSON.stringify({from:myId,msg:{t:"leave"}}),qos:0,retain:false}},c=>{
      c.on("message",(t,buf)=>{let d;try{d=JSON.parse(buf.toString())}catch(e){return}if(d&&(d.to==="*"||d.to===myId))onMsg(d.msg);});
      c.subscribe(TOPIC(code)+"/c",{qos:1},err=>{if(err)onFail("通信サーバーでエラーが起きました。");else onOpen();});
    },()=>onFail("通信サーバーに接続できませんでした。ネット接続を確認して、ページを再読み込みしてください。"));
    this.onReconnect=onOpen;
  },
  send(msg){
    if(LOCAL){this.bc&&this.bc.postMessage({to:"host",from:myId,msg});return;}
    this.client&&this.client.publish(TOPIC(this.code)+"/h",JSON.stringify({from:myId,msg}),{qos:1});
  }
};

// ================== ゲーム状態（ホストだけが更新） ==================
let S=null;           // 現在の状態（ホストは正本、参加者は受信したコピー）
let isHost=false;
let joined=false;

function newState(code){return{code,settings:{spinMax:6},phase:"lobby",players:[],turn:0,stage:"spin",pending:null,seq:0,fx:[],log:[],retired:0,hostId:myId};}
const cur=()=>S.players[S.turn];
const byId=id=>S.players.find(p=>p.id===id);
function log(t){S.log.unshift(t);S.log=S.log.slice(0,40);}
// 演出（ルーレット・移動・できごと）を順番に記録する。画面側はこの順に再生してから数字を反映する。
function fx(o){o.seq=++S.seq;S.fx=(S.fx||[]).concat(o).slice(-40);}
function ev(p,icon,title,text,kind){fx({k:"event",pid:p.id,icon,title,text,kind});log(p.name+"："+title+(text?"（"+text+"）":""));}
function addMoney(p,v){p.money+=v;}
// 人生の初期状態（生まれたて）。能力は1ずつ＋ランダムに3ポイント。
function freshLife(){
  const st={sense:1,body:1,int:1,charm:1};const ks=Object.keys(ST);for(let i=0;i<3;i++)st[pick(ks)]++;
  return{pos:"y0",money:100,job:null,children:0,married:false,spouse:null,love:null,house:null,retired:false,score:null,st};
}
function dealStart(p){const ks=Object.keys(CARDS).filter(k=>k!=="snipe"&&k!=="swap");p.hand=[pick(ks),pick(ks)];Object.assign(p,{shield:0,bonus:false,blocked:false,mod:null,cardUsed:false});}
function addPlayer(id,name,cpu,gender){
  if(S.players.length>=6)return false;
  S.players.push(Object.assign({id,name:name.slice(0,12)||"プレイヤー",gender:gender==="f"||gender==="m"?gender:pick(["m","f"]),color:COLORS[S.players.length],cpu:!!cpu,online:true},freshLife()));
  return true;
}

function hostHandle(from,msg){
  if(!S)return;
  if(msg.t==="join"){
    const p=byId(from);
    if(p){p.online=true;if(msg.name&&S.phase==="lobby"){p.name=msg.name.slice(0,12);if(msg.gender)p.gender=msg.gender;}}
    else if(S.phase!=="lobby"){Net.sendTo(from,{t:"reject",reason:"ゲームはもう始まっています。観戦モードで表示します。"});}
    else if(!addPlayer(from,msg.name||"",false,msg.gender)){Net.sendTo(from,{t:"reject",reason:"ルームが満員です（最大6人）。"});}
    commit();return;
  }
  if(msg.t==="leave"){const p=byId(from);if(p){p.online=false;commit();}return;}
  if(msg.t==="hello"){const p=byId(from);if(p&&!p.online){p.online=true;commit();}else Net.sendTo(from,{t:"state",s:S});return;}
  if(msg.t==="act")act(from,msg.a);
}

function act(pid,a){
  if(S.phase!=="play")return;
  const p=cur();if(!p||p.id!==pid)return;
  if(a.type==="spin"&&S.stage==="spin"){
    const raw=rnd(spinMax());
    fx({k:"spin",pid,value:raw});
    let v=raw;const notes=[];
    if(p.mod==="dash"){v+=3;notes.push("🚀ダッシュで+3");}
    if(p.mod==="half"){v=Math.ceil(v/2);notes.push("🐢ちょい進みで半分");}
    if(p.blocked){v=Math.ceil(v/2);p.blocked=false;notes.push("⛔通せんぼされて半分");}
    p.mod=null;
    log(p.name+" はルーレットで "+raw+" を出した"+(notes.length?"（"+notes.join("・")+" → "+v+"マス）":""));
    if(notes.length)fx({k:"toast",pid,text:notes.join("・")+" → "+v+"マス進む"});
    startMove(p,v);
  }else if(a.type==="card"&&S.stage==="spin"&&!p.cardUsed){
    if(!playCard(p,a))return;
  }else if(a.type==="branch"&&S.stage==="branch"){
    if(!N[p.pos].next.includes(a.to))return;
    step(p,a.to);moveOn(p);
  }else if(a.type==="choose"&&S.stage==="choice"){
    const ch=S.choice;const o=ch&&ch.opts[a.idx];if(!o||o.disabled)return;
    S.choice=null;S.stage="resolve";
    if(applyChoice(p,ch,a.idx)!=="wait")endTurn();
  }else if(a.type==="house"&&S.stage==="house"){
    const h=HOUSES[a.idx];
    if(h){p.house={name:h.name,cost:h.cost};addMoney(p,-h.cost);ev(p,"🏠","マイホーム購入",h.name+" を "+man(h.cost)+" で買った");}
    else log(p.name+" は家を買わなかった");
    endTurn();
  }else return;
  commit();
}
function step(p,to){
  p.pos=to;S.pending.remaining--;S.pending.path.push(to);
  const n=N[to];
  if(n.stop)S.pending.remaining=0;
  else if(n.type==="payday"&&S.pending.remaining>0)payday(p,true);
}
function startMove(p,v){S.pending={remaining:v,path:[p.pos]};moveOn(p);}
function emitMove(p){if(S.pending.path.length>1)fx({k:"move",pid:p.id,path:S.pending.path.slice()});S.pending.path=[p.pos];}
function moveOn(p){
  while(S.pending.remaining>0){
    const n=N[p.pos];
    if(n.next.length>1){emitMove(p);S.stage="branch";return;}
    if(!n.next.length)break;
    step(p,n.next[0]);
  }
  emitMove(p);
  S.stage="resolve";
  if(resolve(p,N[p.pos])!=="wait")endTurn();
}
function payday(p,passing){
  let s=p.job?p.job.salary:0;
  if(!passing&&p.bonus&&s){s*=2;p.bonus=false;log(p.name+" のボーナスカードで給料2倍！");}
  addMoney(p,s);
  if(passing)log(p.name+" は給料日を通過して +"+man(s));
  else ev(p,"💰","給料日",p.job?p.job.name+"の給料 +"+man(s):"まだ仕事がないので給料なし");
}
const SHIELDABLE=["money","perchild","tax","invest","dream","lottery"];
function resolve(p,n){
  const before=p.money;
  const r=resolve2(p,n);
  if(p.shield&&SHIELDABLE.includes(n.type)&&p.money<before){
    const lost=before-p.money;p.money=before;p.shield--;
    ev(p,"🛡️","保険カードで守った！","-"+man(lost)+" をふせいだ");
  }
  return r;
}
function resolve2(p,n){
  const others=S.players.filter(o=>o!==p&&!o.retired);
  switch(n.type){
    case "money":{addMoney(p,n.amount);const t=n.st?applyEff(p,n.st):"";ev(p,n.icon,n.label,n.text+" "+(n.amount>=0?"+":"")+man(n.amount)+(t?"・"+t:""),t?"stat":null);break;}
    case "payday":payday(p,false);break;
    case "job":return ask(p,jobChoice(p,n.tier===3?"dream":n.tier===2?"college":"career"));
    case "jobchange":return ask(p,jobChoice(p,"change"));
    case "choice":{const c=CHOICES[n.key];return ask(p,{kind:"event",title:c.title,icon:c.icon,opts:c.opts.map(o=>({label:o.label,desc:effText(o.eff),eff:o.eff}))});}
    case "meet":return ask(p,{kind:"meet",title:n.label+"：だれとデートする？",icon:"💘",
      text:p.married?"":p.love?"いまは "+PARTNERS[p.love.who].name+"（好感度"+p.love.aff+"）とデート中。乗りかえると好感度はリセット":"",
      opts:p.married?[{label:"家族を大切にする",desc:"魅力+1",eff:{charm:1}}]:candidates(p).map(([q,i])=>({label:q.icon+" "+q.name,desc:q.desc+"（好き："+ST[q.like]+"）",who:i})).concat([{label:"今はひとりを楽しむ",desc:"魅力+1",eff:{charm:1}}])});
    case "date":
      if(p.married){addMoney(p,-20);const t=applyEff(p,{charm:1});ev(p,"💑","夫婦でおでかけ","-"+man(20)+"・"+t,"love");break;}
      if(!p.love){ev(p,"💑","デート","デートする相手がいない…（💘出会いのマスで相手を見つけよう）");break;}
      {const q=PARTNERS[p.love.who];return ask(p,{kind:"date",title:q.icon+" "+q.name+" とのデートプラン",icon:"💑",text:"好感度 "+p.love.aff+"／100　"+q.name+"は"+ST[q.like]+"が高い人が好き（あなたの"+ST[q.like]+"："+p.st[q.like]+"）",
        opts:DATES.map(d=>({label:d.icon+" "+d.label,desc:(d.cost?"-"+man(d.cost)+"・":"")+"好感度+"+d.aff+(d.bonus?"（"+ST[d.bonus.stat]+d.bonus.min+"以上なら+"+(d.aff+d.bonus.aff)+"）":"")})).concat([{label:"今回は見送る",desc:"お金は使わない"}])});}
    case "propose":
      if(p.married){log(p.name+" はもう結婚している");break;}
      if(!p.love){ev(p,"💍",n.label,"プロポーズする相手がいない…");break;}
      {const q=PARTNERS[p.love.who];const pr=proposeRate(p.love.aff);
       return ask(p,{kind:"propose",title:q.icon+" "+q.name+" にプロポーズする？",icon:"💍",text:"好感度 "+p.love.aff+"／100",
        opts:[{label:"プロポーズする！",desc:"成功率 約"+Math.round(pr*100)+"%・失敗すると好感度-15"},{label:"まだやめておく",desc:"デートを重ねてから"}]});}
    case "dream":dreamChance(p,n);break;
    case "marry":{p.married=true;let g=0;others.forEach(o=>{addMoney(o,-30);g+=30;});addMoney(p,g);ev(p,"💒","結婚おめでとう！","みんなからご祝儀 +"+man(g));break;}
    case "baby":if(!p.married){ev(p,"👶",n.label,"結婚していないので子どもはまだ…");break;}
      if(!p.house){ev(p,"🏠",n.label,"家がないので子どもはまだ…（家を買ってから！）");break;}
      {p.children+=n.n;let g=0;others.forEach(o=>{addMoney(o,-10*n.n);g+=10*n.n;});addMoney(p,g);ev(p,"👶",n.n>1?"ふたごが生まれた！":"赤ちゃんが生まれた！","みんなからお祝い +"+man(g));break;}
    case "perchild":{const v=n.amount*p.children;addMoney(p,v);ev(p,n.icon,n.label,p.children?n.text+" "+(v>=0?"+":"")+man(v):"子どもがいないので何もなし");break;}
    case "lottery":{const {r,f}=roll(p);const w=f===1?(spinMax()===10?500:300):f>=0.8?100:0;addMoney(p,w);ev(p,"🎟️","宝くじ","ルーレット "+r+"："+(w?"当たり！ +"+man(w):"はずれ…"));break;}
    case "invest":{const {r,f}=roll(p);const v=Math.round((f-0.55)*10)*50;addMoney(p,v);ev(p,n.icon,n.label,"ルーレット "+r+"："+(v>=0?"+":"")+man(v));break;}
    case "raise":if(p.job){p.job.salary+=n.amount;ev(p,"⬆️","昇進！","給料が "+man(p.job.salary)+" になった");}else ev(p,"⬆️","昇進","仕事がないので変化なし");break;
    case "tax":{const v=Math.max(30,p.job?p.job.salary:0);addMoney(p,-v);ev(p,"🧾","税金","-"+man(v));break;}
    case "house":
      if(p.house){ev(p,"🏠","マイホーム","もう家を持っている");break;}
      if(p.cpu){const ok=HOUSES.filter(h=>h.cost<=p.money);const h=ok.length?ok[ok.length-1]:Math.random()<.7?HOUSES[0]:null;
        if(h){p.house={name:h.name,cost:h.cost};addMoney(p,-h.cost);ev(p,"🏠","マイホーム購入",h.name+" を "+man(h.cost)+" で買った");}else log(p.name+" は家を買わなかった");break;}
      S.stage="house";return "wait";
    case "goal":retire(p);break;
    case "card":drawCard(p);break;
  }
}
// ================== カード ==================
const CARDS={
  dash:{name:"ダッシュ",icon:"🚀",desc:"このターン、ルーレットの目+3",w:3},
  half:{name:"ちょい進み",icon:"🐢",desc:"このターン、ルーレットの目が半分（止まりたいマスをねらう）",w:2},
  snipe:{name:"ねらい撃ち",icon:"🎯",desc:"ルーレットを回さず、好きな数だけ進む",w:1,num:true},
  shield:{name:"保険",icon:"🛡️",desc:"次にお金が減るできごとを1回だけ無効にする",w:3},
  bonus:{name:"ボーナス",icon:"💴",desc:"次に止まった給料日の給料が2倍",w:2},
  collect:{name:"取り立て",icon:"🧾",desc:"好きな人から80万円もらう",w:2,target:true},
  swap:{name:"転職交換",icon:"🔄",desc:"好きな人と仕事（給料）を交換する",w:1,target:true},
  block:{name:"通せんぼ",icon:"⛔",desc:"好きな人の次のルーレットの目を半分にする",w:2,target:true}};
const HAND_MAX=5;
function drawCard(p){
  if((p.hand||[]).length>=HAND_MAX){ev(p,"🃏","カード","手札がいっぱいでもらえなかった");return;}
  const pool=[];for(const [k,c] of Object.entries(CARDS))for(let i=0;i<c.w;i++)pool.push(k);
  const k=pick(pool);p.hand=(p.hand||[]).concat(k);
  ev(p,CARDS[k].icon,"カードゲット！","「"+CARDS[k].name+"」："+CARDS[k].desc);
}
function playCard(p,a){
  const i=(p.hand||[]).indexOf(a.card);if(i<0)return false;
  const c=CARDS[a.card];const t=c.target?S.players.find(o=>o.id===a.target&&o!==p):null;
  if(c.target&&!t)return false;
  if(c.num&&!(a.num>=1&&a.num<=spinMax()))return false;
  p.hand.splice(i,1);p.cardUsed=true;
  switch(a.card){
    case "dash":case "half":p.mod=a.card;ev(p,c.icon,"カード「"+c.name+"」",c.desc);break;
    case "shield":p.shield=(p.shield||0)+1;ev(p,c.icon,"カード「"+c.name+"」","次にお金が減るできごとを1回ふせぐ");break;
    case "bonus":p.bonus=true;ev(p,c.icon,"カード「"+c.name+"」","次に止まった給料日の給料が2倍");break;
    case "collect":{const v=80;addMoney(t,-v);addMoney(p,v);ev(p,c.icon,"カード「"+c.name+"」",t.name+" から +"+man(v));break;}
    case "swap":{const j=p.job;p.job=t.job;t.job=j;ev(p,c.icon,"カード「"+c.name+"」",t.name+" と仕事を交換！ → "+(p.job?p.job.name+"（給料 "+man(p.job.salary)+"）":"無職"));break;}
    case "block":t.blocked=true;ev(p,c.icon,"カード「"+c.name+"」",t.name+" の次のルーレットの目が半分に");break;
    case "snipe":ev(p,c.icon,"カード「"+c.name+"」",a.num+" マス進む");log(p.name+" はねらい撃ちで "+a.num+" マス進む");startMove(p,a.num);break;
  }
  return true;
}
// ================== 能力・選択肢・恋愛 ==================
function meets(p,req){return Object.entries(req||{}).every(([k,v])=>p.st[k]>=v);}
function reqText(req){const e=Object.entries(req||{});return e.length?"必要："+e.map(([k,v])=>ST[k]+v).join("・"):"条件なし";}
function effText(eff){
  const t=[];for(const [k,v] of Object.entries(eff||{})){
    if(ST[k])t.push(ST[k]+(v>=0?"+":"")+v);else if(k==="money")t.push((v>=0?"+":"-")+man(Math.abs(v)));
    else if(k==="best")t.push("いちばん高い能力+"+v);else if(k==="worst")t.push("いちばん低い能力+"+v);}
  return t.join("・");
}
function applyEff(p,eff){
  const e=Object.assign({},eff||{});
  const ks=Object.keys(ST);
  if(e.best){const k=ks.slice().sort((a,b)=>p.st[b]-p.st[a])[0];e[k]=(e[k]||0)+e.best;delete e.best;}
  if(e.worst){const k=ks.slice().sort((a,b)=>p.st[a]-p.st[b])[0];e[k]=(e[k]||0)+e.worst;delete e.worst;}
  for(const k of ks)if(e[k])p.st[k]=Math.max(0,Math.min(20,p.st[k]+e[k]));
  if(e.money)addMoney(p,e.money);
  return effText(e);
}
function jobChoice(p,mode){
  const mk=(j,i,dream)=>({label:(j.icon||"💼")+" "+j.name,desc:"給料"+man(j.salary)+"・"+reqText(j.req)+(dream?"・夢チャンスで大きく稼げる":""),job:Object.assign({name:j.name,salary:j.salary},dream?{dream:i,icon:j.icon}:{}),disabled:!meets(p,j.req)});
  let opts=[];
  if(mode==="career")opts=JOBS1.map(j=>mk(j));
  if(mode==="college")opts=JOBS2.map(j=>mk(j)).concat(JOBS1.map(j=>mk(j)));
  if(mode==="dream")opts=DREAMS.map((j,i)=>mk(j,i,true));
  if(mode==="change")opts=JOBS2.map(j=>mk(j)).concat(DREAMS.map((j,i)=>mk(j,i,true)),JOBS1.map(j=>mk(j))).filter(o=>!p.job||o.job.name!==p.job.name);
  opts.sort((a,b)=>(a.disabled?1:0)-(b.disabled?1:0));
  if(mode==="change")opts.push({label:"今の仕事を続ける",desc:p.job?p.job.name+"（給料"+man(p.job.salary)+"）":""});
  else opts.push({label:"🧑‍🔧 "+(mode==="dream"?"夢を追いながらアルバイト":"フリーター"),desc:"給料"+man(FREETER.salary)+"・条件なし",job:{name:FREETER.name,salary:FREETER.salary}});
  const t={career:"就職先を選ぼう",college:"大卒の就職先を選ぼう",dream:"どの夢に挑戦する？",change:"転職のチャンス！"}[mode];
  return{kind:"job",title:t,icon:mode==="dream"?"🌟":"💼",text:"あなたの能力："+Object.keys(ST).map(k=>ST[k]+p.st[k]).join("・"),opts};
}
function proposeRate(a){return a>=70?1:a>=50?0.75:a>=30?0.4:0.15;}
function ask(p,ch){
  ch.pid=p.id;
  if(p.cpu){const r=applyChoice(p,ch,cpuPick(p,ch));return r;}
  S.choice=ch;S.stage="choice";return "wait";
}
function applyChoice(p,ch,idx){
  const o=ch.opts[idx];
  if(ch.kind==="event"){const t=applyEff(p,o.eff);ev(p,ch.icon,ch.title,o.label+"："+t,"stat");return;}
  if(ch.kind==="job"){
    if(!o.job){log(p.name+" は今の仕事を続ける");return;}
    p.job=Object.assign({},o.job);
    if(p.job.dream!=null)ev(p,p.job.icon,"夢への第一歩！",p.job.name+"になった（給料 "+man(p.job.salary)+"）","job");
    else ev(p,"💼",ch.title==="転職のチャンス！"?"転職！":"就職！",p.job.name+"になった（給料 "+man(p.job.salary)+"）","job");
    return;
  }
  if(ch.kind==="meet"){

    const q=PARTNERS[o.who];p.love={who:o.who,aff:20+p.st[q.like]*3};
    ev(p,"💘","出会い！",q.name+" とデートすることに（好感度 "+p.love.aff+"）","love");return;
  }
  if(ch.kind==="date"){
    const d=DATES[idx];if(!d){log(p.name+" はデートを見送った");return;}
    const q=PARTNERS[p.love.who];
    let g=d.aff+Math.floor(p.st[q.like]/2);
    if(d.bonus&&p.st[d.bonus.stat]>=d.bonus.min)g+=d.bonus.aff;
    addMoney(p,-d.cost);p.love.aff=Math.min(100,p.love.aff+g);
    ev(p,d.icon,"デート："+d.label,q.name+" の好感度 +"+g+"（"+p.love.aff+"／100）"+(d.cost?"・-"+man(d.cost):""),"love");return;
  }
  if(ch.kind==="propose"){
    if(idx!==0){log(p.name+" はプロポーズを見送った");return;}
    const q=PARTNERS[p.love.who];
    if(Math.random()<proposeRate(p.love.aff)){
      p.married=true;p.spouse=p.love.who;
      const others=S.players.filter(o2=>o2!==p&&!o2.retired);let g=0;others.forEach(o2=>{addMoney(o2,-30);g+=30;});addMoney(p,g);
      ev(p,"💒","プロポーズ大成功！",q.name+" と結婚！みんなからご祝儀 +"+man(g),"party");
    }else{p.love.aff=Math.max(0,p.love.aff-15);ev(p,"💔","返事は「もう少し待って」…",q.name+" の好感度 -15（"+p.love.aff+"）","loss");}
    return;
  }
}
function cpuPick(p,ch){
  const ok=ch.opts.map((o,i)=>[o,i]).filter(([o])=>!o.disabled);
  if(ch.kind==="job"){let best=ok[ok.length-1][1],bv=-1;for(const [o,i] of ok){if(!o.job)continue;const v=o.job.salary+(o.job.dream!=null?40:0);if(v>bv){bv=v;best=i;}}
    if(p.job&&ch.title==="転職のチャンス！"&&bv<p.job.salary+(p.job.dream!=null?40:0)+15)return ch.opts.length-1;return best;}
  if(ch.kind==="meet"){if(p.married)return 0;const ks=Object.keys(ST);const k=ks.slice().sort((a,b)=>p.st[b]-p.st[a])[0];const i=ch.opts.findIndex(o=>o.who!=null&&PARTNERS[o.who].like===k);return i>=0?i:0;}
  if(ch.kind==="date"){let best=DATES.length,bv=0;DATES.forEach((d,i)=>{if(p.money-d.cost<50)return;const v=d.aff+(d.bonus&&p.st[d.bonus.stat]>=d.bonus.min?d.bonus.aff:0)-d.cost/10;if(v>bv){bv=v;best=i;}});return best;}
  if(ch.kind==="propose")return p.love&&p.love.aff>=45?0:1;
  return pick(ok)[1];
}
function setDream(p,i){const d=DREAMS[i];p.job={name:d.name,salary:d.salary,dream:i,icon:d.icon};ev(p,d.icon,"夢への第一歩！",d.name+"になった（給料 "+man(d.salary)+"）");}
function dreamChance(p,n){
  const {r,f}=roll(p);
  if(p.job&&p.job.dream!=null){
    const d=DREAMS[p.job.dream];
    if(f>=0.8){addMoney(p,400);p.job.salary+=30;ev(p,d.icon,"夢チャンス大成功！","ルーレット "+r+"："+d.win+" +"+man(400)+"・給料アップ");}
    else if(f>=0.4){addMoney(p,80);ev(p,d.icon,"夢チャンス","ルーレット "+r+"："+d.mid+" +"+man(80));}
    else{addMoney(p,-60);ev(p,d.icon,"夢チャンス","ルーレット "+r+"："+d.lose+" -"+man(60));}

    addMoney(p,v);ev(p,"🎯",n.label,"趣味のダーツで勝負！ルーレット "+r+"："+(f===1?"ど真ん中のブル！":f>=0.7?"いい感じに命中":"参加費だけ払った…")+" "+(v>=0?"+":"")+man(v));

function retire(p){
  p.retired=true;const b=RETIRE_BONUS[S.retired]||0;S.retired++;
  addMoney(p,b);
  let msg=S.retired+"番目にゴール！ボーナス +"+man(b);
  if(p.house){const {f}=roll(p);const val=Math.round(p.house.cost*(0.5+f*1.5));addMoney(p,val);p.house.sold=val;msg+="／家を "+man(val)+" で売却";}
  p.score=p.money<0?Math.round(p.money*1.2):p.money;

function endTurn(){
  S.stage="spin";S.pending=null;
  const cp=cur();if(cp){cp.cardUsed=false;cp.mod=null;}
  if(S.players.every(p=>p.retired)){S.phase="end";log("全員ゴール！ゲーム終了");return;}
  do{S.turn=(S.turn+1)%S.players.length;}while(cur().retired);
}
function commit(){
  Net.broadcast({t:"state",s:S});
  store("l","mirai-host",JSON.stringify({code:S.code,s:S}));
  render();scheduleCpu();
}
let cpuTimer=null;
function scheduleCpu(){
  clearTimeout(cpuTimer);
  if(!isHost||S.phase!=="play")return;
  const p=cur();if(!p.cpu)return;
  // 画面の演出が終わってから少し待って動く
  const tick=()=>{if(animating||queue.length){cpuTimer=setTimeout(tick,300);return;}cpuTimer=setTimeout(()=>botAct(p.id),900*SPEED);};
  cpuTimer=setTimeout(tick,300);
}
function botCard(p){
  if(p.cardUsed||!(p.hand||[]).length||Math.random()<0.35)return null;
  const others=S.players.filter(o=>o!==p&&!o.retired);
  const prog=o=>Object.keys(N).indexOf(o.pos);
  const rich=S.players.filter(o=>o!==p).sort((a,b)=>b.money-a.money)[0];
  for(const k of p.hand){
    if(k==="shield"&&!p.shield)return{card:k};
    if(k==="bonus"&&!p.bonus&&p.job)return{card:k};
    if(k==="collect"&&rich)return{card:k,target:rich.id};
    if(k==="swap"){const best=S.players.filter(o=>o!==p&&o.job&&(!p.job||o.job.salary>p.job.salary+20)).sort((a,b)=>b.job.salary-a.job.salary)[0];if(best)return{card:k,target:best.id};}
    if(k==="block"&&others.length){const lead=others.sort((a,b)=>prog(b)-prog(a))[0];return{card:k,target:lead.id};}
    if(k==="dash")return{card:k};
    if(k==="snipe")return{card:k,num:spinMax()};
  }
  return null;
}
function botAct(id){
  const p=S.players.find(o=>o.id===id);if(!p||S.phase!=="play"||cur()!==p)return;
  if(S.stage==="spin"){const c=botCard(p);if(c)act(p.id,Object.assign({type:"card"},c));else act(p.id,{type:"spin"});}
  else if(S.stage==="branch")act(p.id,{type:"branch",to:pick(N[p.pos].next)});
  else if(S.stage==="choice")act(p.id,{type:"choose",idx:cpuPick(p,S.choice)});
  else if(S.stage==="house"){const ok=HOUSES.map((h,i)=>[h,i]).filter(([h])=>h.cost<=p.money);act(p.id,{type:"house",idx:ok.length?ok[ok.length-1][1]:0});}
}

// 画面に出す状態 V は、演出（ルーレット→移動→できごと）を再生し終えてから S に追いつく。
// こうすることで、ルーレット中に次の人の番やお金の増減が先に見えてしまわない。
let V=null,shownSeq=0,wheelRot=0,animPos={},animating=false,animFocus=null;
const queue=[];
const clone=o=>JSON.parse(JSON.stringify(o));
function render(){
  if(!S)return;
  $("#hdrCode").textContent="ルーム "+S.code;
  if(S.phase==="lobby"){V=clone(S);shownSeq=S.seq;return lobbyView();}
  if(!$("#boardSvg"))gameShell();
  if(!V||V.phase==="lobby"){V=clone(S);shownSeq=Math.max(shownSeq,S.seq);animPos={};}
  const items=(S.fx||[]).filter(o=>o.seq>shownSeq);
  if(items.length)shownSeq=items[items.length-1].seq;
  items.forEach(o=>queue.push(o));
  queue.push({k:"apply",s:clone(S)});
  if(!animating)runQueue();
}
async function runQueue(){
  animating=true;
  while(queue.length){
    const it=queue.shift();
    if(it.k==="apply"){if(queue.some(q=>q.k==="apply"))continue;V=it.s;V.players.forEach(p=>animPos[p.id]=p.pos);animFocus=null;drawTokens();drawSide();continue;}
    animFocus=it.pid;drawControls();
    if(it.k==="spin")await spinWheel(it.value);
    else if(it.k==="move"){for(const id of it.path.slice(1)){animPos[it.pid]=id;drawTokens();await wait(260);}}
    else if(it.k==="event")await showEvent(it);
    else if(it.k==="toast")await showEvent({pid:it.pid,icon:"✨",title:"",text:it.text},1100);
  }
  animating=false;drawControls();
}
const SPEED=params.get("fast")?0.08:1; // テスト用の早送り

function spinWheel(v){
  const w=$("#wheel");if(!w)return wait(0);
  const st=360/spinMax(),center=(v-1)*st+st/2;
  const target=((360-center)%360+360)%360;
  wheelRot+=1080+((target-wheelRot%360)+360)%360;
  w.style.transform="rotate("+wheelRot+"deg)";
  return wait(1500).then(()=>{$("#spinVal").textContent=v;});
}

  el.innerHTML=`<div class="ev-band"><div class="ev-icon">${esc(e.icon||"✨")}</div>${e.title?`<div class="ev-ttl">${esc(e.title)}</div>`:""}</div>
    <div class="ev-body"><div class="ev-who">${p?`<span class="dot" style="display:inline-block;vertical-align:middle;background:${p.color}"></span> ${esc(p.name)}`:""}</div>
    ${amt?`<div class="ev-amt ${amt[0]==="+"?"plus":"minus"}">${esc(amt)}</div>`:""}
    ${chips?`<div class="chips">${chips}</div>`:""}
    <div>${esc(e.text||"")}</div></div>`;
  void el.offsetWidth;el.classList.add("show");particles(kind);
  if(mounted3D){const k={gain:"gain",loss:"loss",party:"party",job:"party",love:"party"}[kind];if(k)B3.effect(e.pid,k,amt);}
  return wait(ms||2300).then(()=>{el.classList.remove("show");el.classList.add("hide");return wait(260);}).then(()=>{el.classList.remove("hide");});
}

function lobbyView(){
  const app=$("#app");
  const url=location.origin+location.pathname+"?room="+S.code+inviteExtra();
  const me=byId(myId);
  app.innerHTML=`<div class="card home">
    <h2>ロビー（ルーム ${esc(S.code)}）</h2>
    ${isHost?`<div class="muted">このURLを友達に送ってください。開くだけで参加できます。</div>
    <div class="invite"><input id="inv" readonly value="${esc(url)}"><button class="ghost" id="cp">コピー</button></div>`:`<div class="muted">${me?"参加しました！ホストがゲームを始めるのを待っています。":"接続中…"}</div>`}
    <div class="plist">${S.players.map(p=>`<div class="pl"><span class="dot" style="background:${p.color}"></span>${p.gender==="f"?"👧":"👦"} ${esc(p.name)}
      ${p.id===S.hostId?'<span class="tag">ホスト</span>':""}${p.cpu?'<span class="tag">CPU</span>':""}${p.id===myId?'<span class="tag">あなた</span>':""}
      ${!p.online&&!p.cpu?'<span class="tag">切断中</span>':""}
      ${isHost&&p.id!==myId?`<button class="ghost" data-kick="${esc(p.id)}" style="margin-left:auto;padding:4px 10px">外す</button>`:""}</div>`).join("")}</div>
    <div class="muted">コース：${spinMax()===6?"じっくりコース（ルーレット1〜6・3〜4人で30〜45分）":"さくさくコース（ルーレット1〜10・3〜4人で15〜25分）"}</div>
    ${isHost?`<div class="row"><button class="ghost" data-course="6">じっくり（30分以上）</button><button class="ghost" data-course="10">さくさく（短め）</button></div>`:""}
    ${isHost?`<div class="row"><button class="ghost" id="cpu" ${S.players.length>=6?"disabled":""}>CPUを追加</button>
      <button id="start" ${S.players.length<2?"disabled":""}>ゲームを始める</button></div>
      <div class="muted">2人以上で始められます（最大6人）。</div>`:""}
  </div>${rulesHtml()}`;
  if(isHost){
    $("#cp").onclick=()=>{const i=$("#inv");i.select();navigator.clipboard&&navigator.clipboard.writeText(i.value).catch(()=>{});$("#cp").textContent="コピーしました";};
    app.querySelectorAll("[data-course]").forEach(b=>{if(+b.dataset.course===spinMax())b.style.borderColor="var(--accent)";b.onclick=()=>{S.settings={spinMax:+b.dataset.course};commit();};});
    $("#cpu").onclick=()=>{const n=S.players.filter(p=>p.cpu).length+1;addPlayer("cpu"+Date.now(),"CPU"+n,true);commit();};
    $("#start").onclick=()=>{S.phase="play";S.turn=0;S.players.forEach(dealStart);log("ゲームスタート！みんなカードを2枚ずつもらった");commit();};
    app.querySelectorAll("[data-kick]").forEach(b=>b.onclick=()=>{S.players=S.players.filter(p=>p.id!==b.dataset.kick);S.players.forEach((p,i)=>p.color=COLORS[i]);if(b.dataset.kick.startsWith("p"))Net.sendTo(b.dataset.kick,{t:"reject",reason:"ホストにルームから外されました。"});commit();});
  }
}

const TW=64,TH=74,PAD=36;
function tx(n){return PAD+n.x*TW;} function ty(n){return PAD+(n.y+2.4)*TH;}
const TYPE_COLOR={choice:"#d0ebff",meet:"#ffdeeb",date:"#fcc2d7",propose:"#faa2c1",jobchange:"#a5d8ff",start:"#ffe3e3",card:"#e5dbff",dream:"#ffec99",payday:"#ffe08a",job:"#a5d8ff",marry:"#ffc9de",baby:"#ffd8a8",house:"#b2f2bb",goal:"#ff8787",branch:"#d0bfff",invest:"#c5f6fa",lottery:"#fff3bf",tax:"#e9ecef"};
function gameShell(){
  const app=$("#app");
  const W=PAD*2+11*TW,H=PAD*2+13.9*TH+18;
  let lines="",tiles="";
  for(const n of Object.values(N))for(const m of n.next.map(id=>N[id]))lines+=`<line x1="${tx(n)}" y1="${ty(n)}" x2="${tx(m)}" y2="${ty(m)}" stroke="var(--line)" stroke-width="8" stroke-linecap="round"/>`;
  for(const n of Object.values(N)){
    const neg=n.type==="money"&&n.amount<0;
    const fill=TYPE_COLOR[n.type]||(neg?"#ffd6d6":"#d3f9d8");
    tiles+=`<g><rect x="${tx(n)-27}" y="${ty(n)-27}" width="54" height="54" rx="12" fill="${fill}" stroke="${n.stop?"#e8590c":"rgba(0,0,0,.15)"}" stroke-width="${n.stop?3:1}"/>
      <text x="${tx(n)}" y="${ty(n)+2}" text-anchor="middle" dominant-baseline="middle" class="tileicon">${n.icon}</text>
      <text x="${tx(n)}" y="${ty(n)+40}" text-anchor="middle" class="tilelabel">${esc(n.label)}</text><title>${esc(n.label+(n.text?"："+n.text:""))}</title></g>`;
  }
  const SM=spinMax(),st=360/SM;
  const seg=[...Array(SM)].map((_,i)=>{const a0=(i*st-90)*Math.PI/180,a1=((i+1)*st-90)*Math.PI/180;
    const c=i%2?"#ffd8a8":"#ffa94d";const am=((i+.5)*st-90)*Math.PI/180;
    return `<path d="M50 50 L${50+48*Math.cos(a0)} ${50+48*Math.sin(a0)} A48 48 0 0 1 ${50+48*Math.cos(a1)} ${50+48*Math.sin(a1)} Z" fill="${c}" stroke="#fff" stroke-width="1"/>
      <text x="${50+34*Math.cos(am)}" y="${50+34*Math.sin(am)}" text-anchor="middle" dominant-baseline="middle" font-size="${SM>6?10:13}" font-weight="700" fill="#5c3a12">${i+1}</text>`;}).join("");
  app.innerHTML=`<div class="game">
    <div class="card board"><div class="stage" id="stage">
      <div class="minimap" id="minimap" title="タップで全体表示"><div class="mmttl">マップ</div><svg id="boardSvg" viewBox="0 0 ${W} ${H}">${lines}${tiles}<g id="tokens"></g></svg></div>
      <div class="camctl"><button id="camFollow" class="on">追いかける</button><button id="camAll">全体を見る</button></div>
    </div></div>
    <div class="side">
      <div class="card ctrl"><div class="wheel-box"><div class="pointer"></div><svg viewBox="0 0 100 100"><g id="wheel">${seg}</g><circle cx="50" cy="50" r="12" fill="var(--panel)"/><text id="spinVal" x="50" y="51" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="800" fill="var(--ink)">-</text></svg></div>
        <div id="controls" style="width:100%"></div></div>
      <div class="card"><div class="players" id="players"></div></div>
      <div class="card"><div class="muted" style="margin-bottom:6px">できごと</div><div class="log" id="log"></div></div>
    </div></div>`;
  const setCam=m=>{window.B3&&B3.setMode(m);$("#camFollow").classList.toggle("on",m==="follow");$("#camAll").classList.toggle("on",m==="all");};
  $("#camFollow").onclick=()=>setCam("follow");$("#camAll").onclick=()=>setCam("all");
  $("#minimap").onclick=()=>setCam($("#camAll").classList.contains("on")?"follow":"all");
  mount3D();
}
// 3D盤面（game3d.js）が読み込めたら使う。WebGLが使えない環境では2Dマップだけで遊べる。
let mounted3D=false;
function mount3D(){
  const st=$("#stage");if(!st||mounted3D)return;
  if(params.get("no3d")){st.classList.add("flat");return;}
  if(!window.B3){if(!window.WebGLRenderingContext)st.classList.add("flat");return;}
  mounted3D=B3.mount(st,N,TYPE_COLOR);
  if(!mounted3D)st.classList.add("flat");
  drawTokens();
}
window.on3DReady=()=>mount3D();
setTimeout(()=>{const st=$("#stage");if(st&&!mounted3D)st.classList.add("flat");},8000);
if(params.get("no3d"))window.on3DReady=()=>{};
function fxOf(e){
  if(/結婚|赤ちゃん|ふたご|就職|夢への|大成功|ゴール|昇進|購入/.test(e.title))return "party";
  const m=(e.text||"").match(/([+-])([\d,]+)万円(?!.*[+-][\d,]+万円)/);
  return m?(m[1]==="+"?"gain":"loss"):null;
}
function drawTokens(){
  const g=$("#tokens");if(!g)return;
  if(mounted3D){
    const focus=animFocus||(V.phase==="play"?V.players[V.turn].id:null);
    B3.setPositions(V.players.map((p,i)=>{const pos=animPos[p.id]||p.pos;return{id:p.id,idx:i,color:p.color,pos,age:N[pos].age,married:p.married,spouse:p.spouse,spouseF:p.spouse!=null&&PARTNERS[p.spouse].g==="f",female:p.gender==="f",children:p.children};}),focus);
  }
  const groups={};
  V.players.forEach((p,i)=>{const pos=animPos[p.id]||p.pos;(groups[pos]=groups[pos]||[]).push({p,i});});
  let h="";
  for(const [pos,list] of Object.entries(groups)){const n=N[pos];
    list.forEach(({p},k)=>{const ox=(k%3-1)*16,oy=k<3?-20:-4;
      h+=`<circle cx="${tx(n)+ox}" cy="${ty(n)+oy-6}" r="9" fill="${p.color}" stroke="#fff" stroke-width="2.5"><title>${esc(p.name)}</title></circle>`;});}
  g.innerHTML=h;
}
function drawSide(){
  if(!$("#players"))return;
  $("#players").innerHTML=V.players.map((p,i)=>`<div class="pc ${V.phase==="play"&&i===V.turn?"active":""}">
    <div class="top"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}${p.id===myId?' <span class="tag">あなた</span>':""}${p.cpu?' <span class="tag">CPU</span>':""}${!p.online&&!p.cpu?' <span class="tag">切断中</span>':""}
      <span class="money ${p.money<0?"neg":""}">${man(p.money)}</span></div>
    <div class="muted">${p.job?(p.job.icon||"")+esc(p.job.name)+"（給料 "+man(p.job.salary)+"）":"無職"}${p.married?"・既婚":""}${p.children?"・子ども"+p.children+"人":""}${p.house?"・"+esc(p.house.name):""}${p.retired?"・🏁ゴール済み":""}・${["こども","わかもの","おとな","シニア"][N[animPos[p.id]||p.pos].age]}</div>
    <div class="stats">${Object.keys(ST).map(k=>`<span title="${ST[k]}">${ST_ICON[k]}${ST[k]} <b>${p.st?p.st[k]:0}</b></span>`).join("")}</div>
    <div class="muted">${p.married?"💍 "+esc(PARTNERS[p.spouse].name)+" と結婚":p.love?"💘 "+esc(PARTNERS[p.love.who].name)+" とデート中・好感度 <b>"+p.love.aff+"</b>":"💘 恋人なし"}</div>
    <div class="muted">🃏カード ${(p.hand||[]).length}枚${p.shield?"・🛡️保険中":""}${p.bonus?"・💴ボーナス待ち":""}${p.blocked?"・⛔通せんぼされ中":""}</div></div>`).join("");
  $("#log").innerHTML=V.log.map(t=>`<div>${esc(t)}</div>`).join("");
  drawControls();
}
function drawControls(){
  const c=$("#controls");if(!c)return;
  if(V.phase==="end"){
    const ranked=V.players.slice().sort((a,b)=>b.score-a.score);
    c.innerHTML=`<div class="result"><div class="who">🎉 結果発表</div>${ranked.map((p,i)=>`<div class="r"><span class="rank">${i+1}</span><span class="dot" style="background:${p.color}"></span><span>${esc(p.name)}</span><span class="money" style="margin-left:auto;font-weight:700">${man(p.score)}</span></div>`).join("")}
      ${isHost?'<button id="again">同じメンバーでもう一回</button>':'<div class="muted">ホストがもう一回を選ぶと再スタートします。</div>'}</div>`;
    if(isHost)$("#again").onclick=()=>{S.players.forEach(p=>Object.assign(p,freshLife()));
      S.players.forEach(dealStart);Object.assign(S,{phase:"play",turn:0,stage:"spin",pending:null,retired:0,log:["もう一回スタート！"]});commit();};
    return;
  }
  const p=V.players[V.turn];const mine=p.id===myId;
  let h=`<div class="who"><span class="dot" style="display:inline-block;vertical-align:middle;background:${p.color}"></span> ${esc(p.name)} の番</div>`;
  if(animating)h+=`<div class="muted">…</div>`;
  else if(mine&&V.stage==="spin")h+=`<button id="spin" style="width:100%;font-size:18px">ルーレットを回す</button>`+handHtml(p);
  else if(mine&&V.stage==="branch"){const n=N[p.pos];h+=`<div class="muted">あと ${V.pending.remaining} マス。どっちに進む？</div><div class="choices">${n.next.map((id,i)=>`<button data-br="${id}">${esc(n.labels[i])}</button>`).join("")}</div>`;}
  else if(V.stage==="choice"&&V.choice){const ch=V.choice;
    if(mine)h+=`<div class="muted">「${esc(ch.title)}」を選んでください</div><button id="reopen" class="ghost">選択画面を開く</button>`;
    else{h+=`<div class="muted">${esc(p.name)} が「${esc(ch.title)}」を選んでいます…</div>`;if(isHost&&!p.cpu)h+=`<button class="ghost" id="proxy" style="margin-top:6px">${esc(p.name)} の代わりに選ぶ</button>`;}}
  else if(mine&&V.stage==="house")h+=`<div class="muted">家を買いますか？（所持金 ${man(p.money)}・足りなければ借金）</div><div class="choices">${HOUSES.map((x,i)=>`<button data-h="${i}">${esc(x.name)}（${man(x.cost)}）</button>`).join("")}<button class="ghost" data-h="-1">買わない</button></div>`;
  else{h+=`<div class="muted">${p.cpu?"CPUが考えています…":"待っています…"}</div>`;
    if(isHost&&!p.cpu)h+=`<button class="ghost" id="proxy" style="margin-top:6px">${esc(p.name)} の代わりに進める</button>`;}
  if(!isHost&&!V.players.some(o=>o.id===myId))h+=`<div class="muted">観戦中</div>`;
  else if(!(mine&&V.stage==="spin")){const me=V.players.find(o=>o.id===myId);if(me&&(me.hand||[]).length)h+=handHtml(me,true);}
  c.innerHTML=h;
  const send=a=>{if(isHost)act(myId,a);else Net.send({t:"act",a});};
  const sb=$("#spin");if(sb)sb.onclick=()=>{sb.disabled=true;send({type:"spin"});};
  c.querySelectorAll("[data-br]").forEach(b=>b.onclick=()=>send({type:"branch",to:b.dataset.br}));
  drawChoiceModal(mine&&!animating&&V.stage==="choice"?V.choice:null,send);
  const ro=$("#reopen");if(ro)ro.onclick=()=>{choiceHidden=false;drawControls();};
  c.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>send({type:"house",idx:+b.dataset.h}));
  const px=$("#proxy");if(px)px.onclick=()=>botAct(p.id);
  c.querySelectorAll("[data-card]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.card,cd=CARDS[k];
    if(cd.target||cd.num){cardSel=k;drawControls();return;}
    send({type:"card",card:k});});
  c.querySelectorAll("[data-tgt]").forEach(b=>b.onclick=()=>{const k=cardSel;cardSel=null;send({type:"card",card:k,target:b.dataset.tgt});});
  c.querySelectorAll("[data-num]").forEach(b=>b.onclick=()=>{const k=cardSel;cardSel=null;send({type:"card",card:k,num:+b.dataset.num});});
  const cx=$("#cardCancel");if(cx)cx.onclick=()=>{cardSel=null;drawControls();};
}
let cardSel=null,choiceHidden=false,choiceShown=null;
// 自分の選択肢は画面中央のカードで出す
function drawChoiceModal(ch,send){
  const m=$("#choiceModal");
  const key=ch?ch.title+"|"+V.seq:null;
  if(key!==choiceShown){choiceHidden=false;choiceShown=key;}
  if(!ch||choiceHidden){m.classList.remove("show");return;}
  m.innerHTML=`<div class="cm card"><div class="cm-icon">${esc(ch.icon||"❓")}</div><div class="cm-title">${esc(ch.title)}</div>
    ${ch.text?`<div class="muted">${esc(ch.text)}</div>`:""}
    <div class="cm-opts">${ch.opts.map((o,i)=>`<button class="cm-opt" data-ch="${i}" ${o.disabled?"disabled":""} style="animation-delay:${i*60}ms"><b>${esc(o.label)}</b>${o.desc?`<small>${esc(o.desc)}</small>`:""}</button>`).join("")}</div>
    <button class="ghost cm-hide" id="cmHide">盤面を見る</button></div>`;
  m.classList.add("show");
  m.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{m.classList.remove("show");send({type:"choose",idx:+b.dataset.ch});});
  $("#cmHide").onclick=()=>{choiceHidden=true;m.classList.remove("show");};
}
function handHtml(p,viewOnly){
  const hand=p.hand||[];
  if(!viewOnly&&cardSel&&hand.includes(cardSel)){
    const cd=CARDS[cardSel];
    const body=cd.num?`<div class="muted">何マス進む？</div><div class="nums">${[...Array(spinMax())].map((_,i)=>`<button data-num="${i+1}">${i+1}</button>`).join("")}</div>`
      :`<div class="muted">だれに使う？</div><div class="choices">${V.players.filter(o=>o.id!==p.id).map(o=>`<button data-tgt="${esc(o.id)}"><span class="dot" style="display:inline-block;vertical-align:middle;background:${o.color}"></span> ${esc(o.name)}（${man(o.money)}${o.job?"・"+esc(o.job.name):""}）</button>`).join("")}</div>`;
    return `<div class="handbox"><div class="who">${cd.icon} ${esc(cd.name)}</div>${body}<button class="ghost" id="cardCancel">やめる</button></div>`;
  }
  if(!hand.length)return `<div class="muted" style="margin-top:6px">手札なし（🃏のマスでカードがもらえます）</div>`;
  const used=p.cardUsed;
  return `<div class="handbox"><div class="muted">${viewOnly?"あなたの手札":used?"このターンはもうカードを使いました":"カードを使う（1ターン1枚・ルーレットの前に）"}</div>
    <div class="hand">${hand.map(k=>{const cd=CARDS[k];return `<button class="cardbtn" data-card="${k}" ${viewOnly||used?"disabled":""} title="${esc(cd.desc)}"><span class="ci">${cd.icon}</span><b>${esc(cd.name)}</b><small>${esc(cd.desc)}</small></button>`;}).join("")}</div></div>`;
}

homeView();
</script>
